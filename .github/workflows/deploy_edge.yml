name: Deploy to Edge Add-ons

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number (e.g. 2.5.10)
        required: true
        type: string

jobs:
  deploy:
    environment: Publishing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Invalid version \"$VERSION\": expected 1 to 4 dot-separated numbers (e.g. 2.5.10)"
            exit 1
          fi

      - name: Packaging
        env:
          VERSION: ${{ inputs.version }}
        run: ./packaging.sh "$VERSION"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ogi-edge-${{ inputs.version }}
          path: dist/ogi-edge.zip

      # bpp submits to every store listed in its keys: keep the Edge entry only.
      - name: Edge keys
        id: edge-keys
        env:
          BPP_KEYS: ${{ secrets.BPP_KEYS }}
        run: |
          if ! jq -e '.edge | objects' <<<"$BPP_KEYS" >/dev/null; then
            echo "::error::BPP_KEYS has no edge entry"
            exit 1
          fi
          keys=$(jq -c '{edge}' <<<"$BPP_KEYS")
          jq -r '.. | strings' <<<"$keys" | while IFS= read -r value; do echo "::add-mask::$value"; done
          echo "::add-mask::$keys"
          echo "keys=$keys" >>"$GITHUB_OUTPUT"

      - name: Edge Add-ons
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ steps.edge-keys.outputs.keys }}
          verbose: true
